name: Feature request
description: Suggest a new effect, parameter, command or API feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you would like to see added.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to achieve that the mod cannot do today?
      placeholder: "I want to ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature, its parameters/commands, and how it should behave.
      placeholder: "A new effect type that ... with params ..."
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds you currently use?
  - type: textarea
    id: example
    attributes:
      label: Example usage
      description: A datapack JSON, command or Java API snippet showing how you imagine using it.
      render: json